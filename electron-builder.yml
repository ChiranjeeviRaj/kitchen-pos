appId: com.restaurantpos.app
productName: Restaurant POS
directories:
  output: cc-pos1
files:
  - backend/dist/**/*
  - frontend/dist/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: backend/src/db/migrations
    to: migrations
win:
  target: nsis
  icon: assets/icon.ico
mac:
  target: dmg
  icon: assets/icon.icns
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: ChiranjeeviRaj
  repo: kitchen-pos
